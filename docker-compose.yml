name: 'fakeflix'

services:
  db:
    image: postgres:15-alpine
    container_name: fakeflix-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - '5432:5432'
    volumes:
      - .data:/var/lib/postgresql/data

  # MinIO: S3-compatible object storage for videos and thumbnails.
  # The root user/password are the same credentials the app signs requests with (.env).
  minio:
    image: minio/minio:latest # same release, cached locally; Docker Hub no longer serves MinIO images
    container_name: fakeflix-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${STORAGE_S3_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${STORAGE_S3_SECRET_KEY:-minioadmin}
    ports:
      - '9000:9000' # S3 API (the app uses http://localhost:9000)
      - '9001:9001' # Web console
    volumes:
      - .minio:/data

  # One-shot: creates the private bucket on first boot, then exits.
  createbuckets:
    image: minio/mc:latest
    container_name: fakeflix-createbuckets
    depends_on:
      - minio
    environment:
      - MINIO_ROOT_USER=${STORAGE_S3_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${STORAGE_S3_SECRET_KEY:-minioadmin}
      - BUCKET=${STORAGE_S3_BUCKET:-fakeflix}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do echo 'waiting for minio...'; sleep 2; done;
      mc mb -p local/$${BUCKET};
      mc anonymous set none local/$${BUCKET};
      echo 'bucket ready';
      "
